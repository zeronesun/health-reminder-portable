name: Build Installer + Portable

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kaima2022/Health-reminder
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # 禁用更新器签名（避免私钥错误）
      - name: Disable updater artifacts
        run: |
          $configPath = "src/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath
        shell: pwsh

      - name: Build Tauri app
        run: |
          cd src
          npm ci
          npm run build
          npm run tauri build -- --target x86_64-pc-windows-msvc

      # 提取版本号
      - name: Get version
        id: get_version
        run: |
          $config = Get-Content -Path src/src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $config.version
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # 1. 便携版 ZIP（使用正确的构建路径）
      - name: Create portable ZIP
        run: |
          $exePath = "src\src-tauri\target\x86_64-pc-windows-msvc\release\health-reminder.exe"
          New-Item -ItemType Directory -Path portable
          Copy-Item $exePath portable\
          $zipName = "Health-Reminder-Portable-v$env:VERSION.zip"
          Compress-Archive -Path portable\* -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      # 2. 安装版 NSIS 安装包（同样修正路径）
      - name: Copy installer
        run: |
          $installerDir = "src\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis"
          $installerPath = Get-ChildItem -Path $installerDir -Filter "*.exe" | Select-Object -First 1
          $installerName = "Health-Reminder-Setup-v$env:VERSION.exe"
          Copy-Item $installerPath.FullName $installerName
          echo "INSTALLER_NAME=$installerName" >> $env:GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Health-Reminder-Builds
          path: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.INSTALLER_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: portable-v${{ env.VERSION }}-build${{ github.run_id }}
          name: "Build v${{ env.VERSION }} (Build #${{ github.run_id }})"
          files: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.INSTALLER_NAME }}
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
