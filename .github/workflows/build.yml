name: Build Installer + Portable

permissions:
  contents: write

on:
  schedule:
    - cron: '0 2 * * *'   # 每天检查一次
  workflow_dispatch:       # 手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: kaima2022/Health-reminder
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # 禁用更新器签名
      - name: Disable updater artifacts
        run: |
          $configPath = "src/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath
        shell: pwsh

      # 构建 Tauri
      - name: Build Tauri app
        run: |
          cd src
          npm ci
          npm run build
          npm run tauri build -- --target x86_64-pc-windows-msvc

      # 提取版本号
      - name: Get version
        id: get_version
        run: |
          $config = Get-Content -Path src/src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $config.version
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # ----------------- 关键新增步骤 -----------------
      # 检查该版本是否已经发布过
      - name: Check if release already exists
        id: check_release
        run: |
          $version = "$env:VERSION"
          $tag = "portable-v$version"
          
          # 调用 GitHub API 获取所有 Release
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers @{ "Authorization" = "token $env:GITHUB_TOKEN" }
          
          $existing = $releases | Where-Object { $_.tag_name -eq $tag }
          
          if ($existing) {
            echo "RELEASE_EXISTS=true" >> $env:GITHUB_ENV
            echo "Release for version $version already exists. Skipping release creation."
          } else {
            echo "RELEASE_EXISTS=false" >> $env:GITHUB_ENV
            echo "No existing release for version $version. Proceeding."
          }
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 1. 便携版 ZIP
      - name: Create portable ZIP
        run: |
          $exePath = "src\src-tauri\target\x86_64-pc-windows-msvc\release\health-reminder.exe"
          New-Item -ItemType Directory -Path portable
          Copy-Item $exePath portable\
          $zipName = "Health-Reminder-Portable-v$env:VERSION.zip"
          Compress-Archive -Path portable\* -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      # 2. 安装版 NSIS 安装包
      - name: Copy installer
        run: |
          $installerDir = "src\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis"
          $installerPath = Get-ChildItem -Path $installerDir -Filter "*.exe" | Select-Object -First 1
          $installerName = "Health-Reminder-Setup-v$env:VERSION.exe"
          Copy-Item $installerPath.FullName $installerName
          echo "INSTALLER_NAME=$installerName" >> $env:GITHUB_ENV

      # 上传 Artifacts（总是上传，方便在 Actions 页面下载）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Health-Reminder-Builds
          path: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.INSTALLER_NAME }}

      # 仅在版本未发布时才创建 Release
      - name: Create Release (if new version)
        if: env.RELEASE_EXISTS == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: portable-v${{ env.VERSION }}
          name: "Health-Reminder Portable v${{ env.VERSION }}"
          files: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.INSTALLER_NAME }}
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
