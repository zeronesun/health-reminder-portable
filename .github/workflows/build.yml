name: Build Installer + Portable

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kaima2022/Health-reminder
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        run: |
          cd src
          npm ci
          npm run build
          npm run tauri build -- --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # 提取版本号
      - name: Get version
        id: get_version
        run: |
          $config = Get-Content -Path src/src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $config.version
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # 1. 准备便携版 ZIP
      - name: Create portable ZIP
        run: |
          # 创建便携文件夹，放入原生 exe
          New-Item -ItemType Directory -Path portable
          Copy-Item "src\src-tauri\target\release\health-reminder.exe" portable\
          # 打包成带版本号的 ZIP
          $zipName = "Health-Reminder-Portable-v$env:VERSION.zip"
          Compress-Archive -Path portable\* -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      # 2. 提取安装版 NSIS 安装包
      - name: Copy installer
        run: |
          # 找到 bundle/nsis 目录下的 exe（Tauri 生成的安装包）
          $installerPath = Get-ChildItem -Path "src\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          $installerName = "Health-Reminder-Setup-v$env:VERSION.exe"
          Copy-Item $installerPath.FullName $installerName
          echo "INSTALLER_NAME=$installerName" >> $env:GITHUB_ENV

      # 上传到 Actions Artifacts（供手动下载）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Health-Reminder-Builds
          path: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.INSTALLER_NAME }}

      # 自动发布 Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: portable-v${{ env.VERSION }}-build${{ github.run_id }}
          name: "Build v${{ env.VERSION }} (Build #${{ github.run_id }})"
          files: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.INSTALLER_NAME }}
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
